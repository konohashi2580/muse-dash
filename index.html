<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Muse Dash</title>
<meta name="theme-color" content="#2e9e6b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{
  --bg:#f6f4ec; --surface:#ffffff; --surface2:#efece1; --text:#22302a; --muted:#6d7a72;
  --border:#ddd8c8; --accent:#2e9e6b; --accent-text:#ffffff;
  --red:#c94f4f; --blue:#3f74b5; --green:#2e9e6b; --gray:#8a8f8a;
  --shadow:0 1px 4px rgba(40,60,50,.10);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#161a17; --surface:#21261f; --surface2:#2a2f28; --text:#e8ece7; --muted:#9aa79d;
    --border:#3a4038; --shadow:0 1px 4px rgba(0,0,0,.4); }
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{margin:0; font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
  background:var(--bg); color:var(--text); line-height:1.55;}
button{font:inherit; cursor:pointer;}
input{font:inherit;}
.wrap{max-width:760px; margin:0 auto; padding:16px 14px 48px;}
header.top{display:flex; align-items:flex-start; justify-content:space-between; gap:8px; margin:6px 0 2px;}
h1{font-size:24px; margin:0; letter-spacing:.02em;}
.dateline{color:var(--muted); font-size:14px; margin-top:2px;}
.updated{color:var(--muted); font-size:12px; margin-top:2px;}
.headbtns{display:flex; gap:6px; flex-shrink:0;}
.iconbtn{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:7px 11px; font-size:13px; color:var(--text); box-shadow:var(--shadow);}
.stats{display:flex; gap:8px; margin:14px 0 4px;}
.stat{flex:1; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:10px 12px; box-shadow:var(--shadow);}
.stat b{font-size:20px; display:block;}
.stat span{font-size:12px; color:var(--muted);}
h2.sec{font-size:16px; margin:22px 0 8px; display:flex; align-items:center; gap:8px;}
h2.sec .cnt{font-size:12px; color:var(--muted); font-weight:normal;}
.card{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:12px 14px; box-shadow:var(--shadow); margin-bottom:8px; text-align:left; width:100%; color:var(--text); display:block;}
button.card:active{transform:scale(.995);}
.card .ttl{font-weight:700; font-size:15px;}
.card .meta{display:flex; gap:8px; align-items:center; margin-top:3px; flex-wrap:wrap;}
.card .period{font-size:12px; color:var(--accent); font-weight:700;}
.card .note{font-size:13px; color:var(--muted); margin-top:3px;}
.badge{font-size:11px; font-weight:700; border-radius:999px; padding:2px 8px; color:#fff;}
.badge.要対応{background:var(--red);} .badge.進行中{background:var(--blue);}
.badge.見守り中{background:var(--green);} .badge.待機中{background:var(--gray);}
.area-name{font-size:12px; font-weight:700; color:var(--muted); letter-spacing:.06em;}
.controls{display:flex; gap:6px; flex-wrap:wrap; margin:10px 0 4px;}
.chip{border:1px solid var(--border); background:var(--surface); color:var(--text); border-radius:999px; padding:5px 12px; font-size:13px;}
.chip.on{background:var(--accent); color:var(--accent-text); border-color:var(--accent);}
.search{width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:12px; background:var(--surface); color:var(--text); margin-top:8px;}
.empty{color:var(--muted); font-size:13px; padding:10px 2px;}
.uprow{display:flex; gap:10px; align-items:baseline; padding:7px 0; border-bottom:1px dashed var(--border);}
.uprow:last-child{border-bottom:none;}
.uprow .d{font-weight:700; font-size:13px; white-space:nowrap;}
.uprow .t{color:var(--accent); font-weight:700; font-size:13px; white-space:nowrap;}
.uprow .ti{font-size:14px;}
.fy .ttl{font-size:15px; font-weight:700;}
.fy .src{font-size:12px; color:var(--muted); margin-top:2px;}
.fy .metrics{display:flex; gap:14px; margin-top:8px; flex-wrap:wrap;}
.fy .metrics div b{font-size:18px; display:block;}
.fy .metrics div span{font-size:11px; color:var(--muted);}
/* gate */
#gate{position:fixed; inset:0; background:var(--bg); z-index:50; display:flex; align-items:center; justify-content:center; padding:20px;}
#gate .box{background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:24px 20px; width:100%; max-width:360px; box-shadow:var(--shadow); text-align:center;}
#gate h2{margin:0 0 4px; font-size:20px;}
#gate p{color:var(--muted); font-size:13px; margin:4px 0 14px;}
#gate input{width:100%; padding:12px; border:1px solid var(--border); border-radius:12px; background:var(--bg); color:var(--text); margin-bottom:10px; font-size:16px;}
#gate .err{color:var(--red); font-size:13px; min-height:18px; margin-bottom:6px;}
.primary{background:var(--accent); color:var(--accent-text); border:none; border-radius:12px; padding:12px 18px; font-weight:700; width:100%;}
.ghostbtn{background:var(--surface); color:var(--text); border:1px solid var(--border); border-radius:12px; padding:11px 16px; font-weight:700;}
/* dialogs */
dialog{border:1px solid var(--border); border-radius:16px; background:var(--surface); color:var(--text); padding:20px; width:min(92vw,480px); box-shadow:var(--shadow);}
dialog::backdrop{background:rgba(20,30,25,.45);}
dialog h3{margin:0 0 8px; font-size:17px;}
dialog .row{margin:6px 0; font-size:14px;}
dialog .row b{color:var(--muted); font-weight:700; margin-right:6px; font-size:12px;}
dialog .close{margin-top:14px; width:100%;}
.tgl{display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px dashed var(--border); font-size:14px;}
.tgl:last-of-type{border-bottom:none;}
.tgl input{width:20px; height:20px; accent-color:var(--accent);}
/* crossword */
.cwgrid{display:grid; grid-template-columns:repeat(4,1fr); gap:4px; max-width:300px; margin:8px auto;}
.cwcell{position:relative; aspect-ratio:1; background:var(--surface2); border:1px solid var(--border); border-radius:8px;}
.cwcell .num{position:absolute; top:2px; left:5px; font-size:10px; color:var(--muted); font-weight:700;}
.cwprev-wrap{text-align:center;}
.cwprev-wrap .go{margin-top:6px;}
#cwdialog .cwcell input{width:100%; height:100%; border:none; background:transparent; text-align:center; font-size:22px; font-weight:700; color:var(--text); border-radius:8px; padding:0; caret-color:var(--accent);}
#cwdialog .cwcell input:focus{outline:2px solid var(--accent); outline-offset:-2px;}
#cwdialog .cwcell.ok input{color:var(--accent);}
#cwdialog .cwcell.ng input{color:var(--red);}
.clues{display:grid; grid-template-columns:1fr 1fr; gap:4px 18px; font-size:13px; margin-top:10px;}
.clues h4{margin:6px 0 4px; font-size:13px;}
.clues p{margin:3px 0; color:var(--text);}
.clues p b{color:var(--accent); margin-right:4px;}
.cwmsg{font-size:13px; margin-top:10px; min-height:18px; text-align:center;}
.cwbtns{display:flex; gap:8px; margin-top:8px;}
.cwbtns button{flex:1;}
footer{color:var(--muted); font-size:12px; text-align:center; margin-top:30px;}
</style>
</head>
<body>

<div id="gate" hidden>
  <div class="box">
    <h2>Muse Dash</h2>
    <p id="gate-desc"></p>
    <div id="gate-setup">
      <input type="password" id="pw1" placeholder="パスワード" autocomplete="new-password">
      <input type="password" id="pw2" placeholder="パスワード（確認）" autocomplete="new-password">
      <div class="err" id="gate-err1"></div>
      <button class="primary" id="pw-set">パスワードを設定して開く</button>
      <p>このパスワードは、この端末の中だけに保存されます。</p>
    </div>
    <div id="gate-unlock" hidden>
      <input type="password" id="pwu" placeholder="パスワード" autocomplete="current-password">
      <div class="err" id="gate-err2"></div>
      <button class="primary" id="pw-open">開く</button>
    </div>
  </div>
</div>

<div class="wrap" id="app" hidden>
  <header class="top">
    <div>
      <h1>Muse Dash</h1>
      <div class="dateline" id="dateline"></div>
      <div class="updated" id="updated"></div>
    </div>
    <div class="headbtns">
      <button class="iconbtn" id="btn-custom">カスタマイズ</button>
      <button class="iconbtn" id="btn-lock">ロック</button>
    </div>
  </header>

  <div class="stats">
    <div class="stat"><b id="stat-total">–</b><span>追跡中の項目</span></div>
    <div class="stat"><b id="stat-needs">–</b><span>要対応</span></div>
  </div>

  <section id="sec-needs">
    <h2 class="sec">要対応 <span class="cnt" id="needs-cnt"></span></h2>
    <div id="needs-list"></div>
  </section>

  <section id="sec-items">
    <h2 class="sec">追跡中の項目</h2>
    <div class="controls" id="chips"></div>
    <input class="search" id="search" type="search" placeholder="項目を検索">
    <div id="area-list"></div>
  </section>

  <section id="sec-foryou">
    <h2 class="sec">あなた向け</h2>
    <div class="card fy" id="foryou"></div>
  </section>

  <section id="sec-upcoming">
    <h2 class="sec">今後の予定</h2>
    <div class="card" id="upcoming"></div>
  </section>

  <section id="sec-crossword">
    <h2 class="sec">ちょっとひと休み</h2>
    <div class="card cwprev-wrap">
      <div style="font-weight:700;">ミニクロスワード（ひらがな）</div>
      <div class="cwgrid" id="cw-preview"></div>
      <button class="primary go" id="cw-play" style="width:auto; padding:10px 26px;">Play</button>
    </div>
  </section>

  <footer>Built for you</footer>
</div>

<dialog id="detail">
  <h3 id="d-title"></h3>
  <div class="row"><b>エリア</b><span id="d-area"></span></div>
  <div class="row"><b>状態</b><span id="d-status"></span></div>
  <div class="row" id="d-period-row"><b>時期</b><span id="d-period"></span></div>
  <div class="row"><b>メモ</b><span id="d-note"></span></div>
  <button class="ghostbtn close" id="d-close">閉じる</button>
</dialog>

<dialog id="custom">
  <h3>カスタマイズ</h3>
  <div id="custom-body"></div>
  <button class="ghostbtn close" id="c-close">閉じる</button>
</dialog>

<dialog id="cwdialog">
  <h3>ミニクロスワード</h3>
  <div class="cwgrid" id="cw-grid" style="max-width:320px;"></div>
  <div class="clues">
    <div><h4>横</h4><div id="clues-across"></div></div>
    <div><h4>縦</h4><div id="clues-down"></div></div>
  </div>
  <div class="cwmsg" id="cw-msg"></div>
  <div class="cwbtns">
    <button class="primary" id="cw-check" style="width:auto; flex:1;">答え合わせ</button>
    <button class="ghostbtn" id="cw-clear">消す</button>
    <button class="ghostbtn" id="cw-close">閉じる</button>
  </div>
</dialog>

<script>
"use strict";
const AREAS = ["SNS運用","創作","お金","学び"];
const STATUSES = ["要対応","進行中","見守り中","待機中"];
let DATA = null;
let filter = "すべて", query = "";
let hiddenAreas = new Set(JSON.parse(localStorage.getItem("mdash_hidden_areas") || "[]"));
let sections = Object.assign({foryou:true, upcoming:true, crossword:true}, JSON.parse(localStorage.getItem("mdash_sections") || "{}"));

/* ---------- password gate ---------- */
async function sha256(str){
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("mdash::" + str));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,"0")).join("");
}
const gate = document.getElementById("gate");
function showApp(){
  gate.hidden = true;
  document.getElementById("app").hidden = false;
  loadData();
}
async function initGate(){
  const hash = localStorage.getItem("mdash_pw_hash");
  if (sessionStorage.getItem("mdash_unlocked") === "1" && hash){ showApp(); return; }
  gate.hidden = false;
  if (!hash){
    document.getElementById("gate-desc").textContent = "最初に、この端末で使うパスワードを設定してください。";
    document.getElementById("gate-setup").hidden = false;
    document.getElementById("gate-unlock").hidden = true;
  } else {
    document.getElementById("gate-desc").textContent = "パスワードを入れて開いてください。";
    document.getElementById("gate-setup").hidden = true;
    document.getElementById("gate-unlock").hidden = false;
  }
}
document.getElementById("pw-set").addEventListener("click", async () => {
  const a = document.getElementById("pw1").value, b = document.getElementById("pw2").value;
  const err = document.getElementById("gate-err1");
  if (a.length < 4){ err.textContent = "4文字以上にしてください。"; return; }
  if (a !== b){ err.textContent = "確認用と一致しません。"; return; }
  localStorage.setItem("mdash_pw_hash", await sha256(a));
  sessionStorage.setItem("mdash_unlocked", "1");
  showApp();
});
document.getElementById("pw-open").addEventListener("click", async () => {
  const v = document.getElementById("pwu").value;
  const err = document.getElementById("gate-err2");
  if ((await sha256(v)) === localStorage.getItem("mdash_pw_hash")){
    sessionStorage.setItem("mdash_unlocked", "1");
    showApp();
  } else { err.textContent = "パスワードが違います。"; }
});
document.getElementById("pwu").addEventListener("keydown", e => { if (e.key === "Enter") document.getElementById("pw-open").click(); });
document.getElementById("btn-lock").addEventListener("click", () => {
  sessionStorage.removeItem("mdash_unlocked");
  location.reload();
});

/* ---------- data & rendering ---------- */
async function loadData(){
  try {
    const res = await fetch("data.json", {cache:"no-store"});
    DATA = await res.json();
  } catch(e) {
    document.getElementById("updated").textContent = "データを読み込めませんでした。";
    return;
  }
  render();
}
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function render(){
  const now = new Date();
  const wd = ["日","月","火","水","木","金","土"][now.getDay()];
  document.getElementById("dateline").textContent = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日（${wd}）`;
  document.getElementById("updated").textContent = "最終更新：" + (DATA.updatedLabel || "");
  const items = [...(DATA.items || [])].sort((a,b) => (a.sort||0) - (b.sort||0));
  const needs = items.filter(i => i.status === "要対応");
  document.getElementById("stat-total").textContent = items.length;
  document.getElementById("stat-needs").textContent = needs.length;
  document.getElementById("needs-cnt").textContent = needs.length ? `${needs.length}件` : "";
  document.getElementById("needs-list").innerHTML =
    needs.length ? needs.map(cardHTML).join("") : `<div class="empty">今は要対応の項目はありません。</div>`;
  // chips
  const chips = ["すべて", ...STATUSES];
  document.getElementById("chips").innerHTML = chips.map(c =>
    `<button class="chip ${filter===c?"on":""}" data-f="${c}">${c}</button>`).join("");
  document.querySelectorAll("#chips .chip").forEach(el =>
    el.addEventListener("click", () => { filter = el.dataset.f; render(); }));
  // areas
  const q = query.trim();
  const visible = items.filter(i =>
    (filter === "すべて" || i.status === filter) &&
    (!q || (i.title + i.note + i.area).includes(q)));
  let html = "";
  for (const area of AREAS){
    if (hiddenAreas.has(area)) continue;
    const list = visible.filter(i => i.area === area);
    if (!list.length) continue;
    html += `<div class="area-name" style="margin:12px 0 6px;">${esc(area)}</div>` + list.map(cardHTML).join("");
  }
  document.getElementById("area-list").innerHTML = html || `<div class="empty">表示できる項目がありません。</div>`;
  bindCards();
  // for you
  document.getElementById("sec-foryou").style.display = sections.foryou ? "" : "none";
  if (DATA.forYou){
    document.getElementById("foryou").innerHTML =
      `<div class="ttl">${esc(DATA.forYou.title)}</div>` +
      (DATA.forYou.source ? `<div class="src">${esc(DATA.forYou.source)}</div>` : "") +
      `<div class="metrics">` + (DATA.forYou.metrics||[]).map(m =>
        `<div><b>${esc(m.value)}</b><span>${esc(m.label)}</span></div>`).join("") + `</div>`;
  }
  // upcoming
  document.getElementById("sec-upcoming").style.display = sections.upcoming ? "" : "none";
  const up = DATA.upcoming || [];
  document.getElementById("upcoming").innerHTML = up.length
    ? up.map(u => `<div class="uprow"><span class="d">${esc(u.date)}</span><span class="t">${esc(u.time)}</span><span class="ti">${esc(u.title)}</span></div>`).join("")
    : `<div class="empty">直近の予定はありません。</div>`;
  document.getElementById("sec-crossword").style.display = sections.crossword ? "" : "none";
}
function cardHTML(i){
  return `<button class="card" data-key="${esc(i.key)}">
    <div class="ttl">${esc(i.title)}</div>
    <div class="meta"><span class="badge ${esc(i.status)}">${esc(i.status)}</span>` +
    (i.period ? `<span class="period">${esc(i.period)}</span>` : "") + `</div>` +
    (i.note ? `<div class="note">${esc(i.note)}</div>` : "") + `</button>`;
}
function bindCards(){
  document.querySelectorAll(".card[data-key]").forEach(el =>
    el.addEventListener("click", () => openDetail(el.dataset.key)));
}
function openDetail(key){
  const i = (DATA.items || []).find(x => x.key === key);
  if (!i) return;
  document.getElementById("d-title").textContent = i.title;
  document.getElementById("d-area").textContent = i.area;
  document.getElementById("d-status").textContent = i.status;
  document.getElementById("d-period-row").style.display = i.period ? "" : "none";
  document.getElementById("d-period").textContent = i.period || "";
  document.getElementById("d-note").textContent = i.note || "";
  document.getElementById("detail").showModal();
}
document.getElementById("d-close").addEventListener("click", () => document.getElementById("detail").close());
document.getElementById("search").addEventListener("input", e => { query = e.target.value; render(); });

/* ---------- customize ---------- */
document.getElementById("btn-custom").addEventListener("click", () => {
  const body = document.getElementById("custom-body");
  let html = `<div style="font-size:12px; color:var(--muted); margin-bottom:4px;">エリアの表示</div>`;
  for (const a of AREAS)
    html += `<label class="tgl"><span>${esc(a)}</span><input type="checkbox" data-area="${esc(a)}" ${hiddenAreas.has(a)?"":"checked"}></label>`;
  html += `<div style="font-size:12px; color:var(--muted); margin:10px 0 4px;">セクションの表示</div>`;
  for (const [k, label] of [["foryou","あなた向け"],["upcoming","今後の予定"],["crossword","ミニクロスワード"]])
    html += `<label class="tgl"><span>${label}</span><input type="checkbox" data-sec="${k}" ${sections[k]?"checked":""}></label>`;
  body.innerHTML = html;
  body.querySelectorAll("input[data-area]").forEach(el => el.addEventListener("change", () => {
    if (el.checked) hiddenAreas.delete(el.dataset.area); else hiddenAreas.add(el.dataset.area);
    localStorage.setItem("mdash_hidden_areas", JSON.stringify([...hiddenAreas]));
    render();
  }));
  body.querySelectorAll("input[data-sec]").forEach(el => el.addEventListener("change", () => {
    sections[el.dataset.sec] = el.checked;
    localStorage.setItem("mdash_sections", JSON.stringify(sections));
    render();
  }));
  document.getElementById("custom").showModal();
});
document.getElementById("c-close").addEventListener("click", () => document.getElementById("custom").close());

/* ---------- crossword ---------- */
const CW_SOL = ["ほかほか","かいがら","ほがらか","からから"];
const CW_NUM = [[1,2,3,4],[5,0,0,0],[6,0,0,0],[7,0,0,0]];
const CW_ACROSS = [[1,"あたたかくて、湯気が出そうな様子"],[5,"海で拾える、貝のからのこと"],[6,"明るくて、気持ちが晴れている様子"],[7,"水分がなくて、乾いている様子"]];
const CW_DOWN = [[1,"できたてのごはんみたいに、あたたかい様子"],[2,"浜辺に落ちている、貝のぬけがら"],[3,"性格が明るいことを表す言葉"],[4,"のどが渇いたときにも使う、乾いた様子"]];
const DAKU = {か:"が",き:"ぎ",く:"ぐ",け:"げ",こ:"ご",さ:"ざ",し:"じ",す:"ず",せ:"ぜ",そ:"ぞ",た:"だ",ち:"ぢ",つ:"づ",て:"で",と:"ど",は:"ば",ひ:"び",ふ:"ぶ",へ:"べ",ほ:"ぼ",う:"ゔ"};
const HANDAKU = {は:"ぱ",ひ:"ぴ",ふ:"ぷ",へ:"ぺ",ほ:"ぽ"};
let cwDir = "across", cwFocus = [0,0];
let cwVals = (localStorage.getItem("mdash_cw") || "").padEnd(16, " ").slice(0, 16).split("");

function cwCellHTML(r, c, interactive){
  const n = CW_NUM[r][c];
  const num = n ? `<span class="num">${n}</span>` : "";
  if (!interactive) return `<div class="cwcell">${num}</div>`;
  return `<div class="cwcell" data-r="${r}" data-c="${c}">${num}<input data-r="${r}" data-c="${c}" value="${cwVals[r*4+c] === " " ? "" : esc(cwVals[r*4+c])}" autocomplete="off" autocapitalize="off" spellcheck="false"></div>`;
}
function renderCwPreview(){
  let html = "";
  for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) html += cwCellHTML(r, c, false);
  document.getElementById("cw-preview").innerHTML = html;
}
function renderCwGrid(){
  let html = "";
  for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) html += cwCellHTML(r, c, true);
  document.getElementById("cw-grid").innerHTML = html;
  document.getElementById("clues-across").innerHTML = CW_ACROSS.map(([n,t]) => `<p><b>${n}</b>${esc(t)}</p>`).join("");
  document.getElementById("clues-down").innerHTML = CW_DOWN.map(([n,t]) => `<p><b>${n}</b>${esc(t)}</p>`).join("");
  document.querySelectorAll("#cw-grid input").forEach(inp => {
    let composing = false;
    inp.addEventListener("compositionstart", () => { composing = true; });
    inp.addEventListener("compositionend", e => { composing = false; cwCommit(inp, e.data || inp.value); });
    inp.addEventListener("input", e => { if (!composing && !e.isComposing) cwCommit(inp, e.data || inp.value); });
    inp.addEventListener("focus", () => {
      const r = +inp.dataset.r, c = +inp.dataset.c;
      if (cwFocus[0] === r && cwFocus[1] === c && document.activeElement === inp) { /* same cell */ }
      cwFocus = [r, c];
      inp.select();
    });
    inp.addEventListener("click", () => {
      const r = +inp.dataset.r, c = +inp.dataset.c;
      if (cwFocus[0] === r && cwFocus[1] === c) cwDir = (cwDir === "across") ? "down" : "across";
    });
    inp.addEventListener("keydown", e => {
      const r = +inp.dataset.r, c = +inp.dataset.c;
      if (e.key === "Backspace"){
        e.preventDefault();
        cwSet(r, c, " ");
        const [pr, pc] = cwStep(r, c, -1);
        cwFocusTo(pr, pc);
      } else if (e.key.startsWith("Arrow")){
        e.preventDefault();
        let nr = r, nc = c;
        if (e.key === "ArrowRight") nc = Math.min(3, c + 1);
        if (e.key === "ArrowLeft") nc = Math.max(0, c - 1);
        if (e.key === "ArrowDown") nr = Math.min(3, r + 1);
        if (e.key === "ArrowUp") nr = Math.max(0, r - 1);
        cwDir = (e.key === "ArrowRight" || e.key === "ArrowLeft") ? "across" : "down";
        cwFocusTo(nr, nc);
      }
    });
  });
}
function cwStep(r, c, d){
  if (cwDir === "across"){ let nc = c + d; if (nc > 3) return [Math.min(3, r + 1), 0]; if (nc < 0) return [Math.max(0, r - 1), 3]; return [r, nc]; }
  let nr = r + d; if (nr > 3) return [0, Math.min(3, c + 1)]; if (nr < 0) return [3, Math.max(0, c - 1)]; return [nr, c];
}
function cwFocusTo(r, c){
  cwFocus = [r, c];
  const inp = document.querySelector(`#cw-grid input[data-r="${r}"][data-c="${c}"]`);
  if (inp){ inp.focus(); inp.select(); }
}
function cwSet(r, c, ch){
  cwVals[r*4+c] = ch;
  localStorage.setItem("mdash_cw", cwVals.join(""));
  const inp = document.querySelector(`#cw-grid input[data-r="${r}"][data-c="${c}"]`);
  if (inp) inp.value = (ch === " ") ? "" : ch;
  const cell = inp ? inp.closest(".cwcell") : null;
  if (cell) cell.classList.remove("ok", "ng");
}
function cwTokenize(text){
  const out = [];
  for (let ch of String(text || "")){
    const code = ch.codePointAt(0);
    if (code >= 0x30A1 && code <= 0x30F6) ch = String.fromCodePoint(code - 0x60); // katakana -> hiragana
    if (ch === "゛" || ch === "゙" || ch === "ﾞ"){ const p = out[out.length-1]; if (p && DAKU[p]) out[out.length-1] = DAKU[p]; continue; }
    if (ch === "゜" || ch === "゚" || ch === "ﾟ"){ const p = out[out.length-1]; if (p && HANDAKU[p]) out[out.length-1] = HANDAKU[p]; continue; }
    if (/[ぁ-ゖ]/.test(ch)) out.push(ch);
  }
  return out;
}
function cwCommit(inp, text){
  const r0 = +inp.dataset.r, c0 = +inp.dataset.c;
  const toks = cwTokenize(text);
  inp.value = cwVals[r0*4+c0] === " " ? "" : cwVals[r0*4+c0];
  if (!toks.length) return;
  let r = r0, c = c0;
  for (const t of toks){
    cwSet(r, c, t);
    [r, c] = cwStep(r, c, 1);
  }
  cwFocusTo(r, c);
}
document.getElementById("cw-play").addEventListener("click", () => {
  renderCwGrid();
  document.getElementById("cw-msg").textContent = "";
  document.getElementById("cwdialog").showModal();
  cwFocusTo(0, 0);
});
document.getElementById("cw-close").addEventListener("click", () => document.getElementById("cwdialog").close());
document.getElementById("cw-clear").addEventListener("click", () => {
  cwVals = Array(16).fill(" ");
  localStorage.setItem("mdash_cw", cwVals.join(""));
  renderCwGrid();
  document.getElementById("cw-msg").textContent = "";
});
document.getElementById("cw-check").addEventListener("click", () => {
  let ok = 0, filled = 0;
  for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++){
    const v = cwVals[r*4+c];
    const cell = document.querySelector(`#cw-grid .cwcell[data-r="${r}"][data-c="${c}"]`);
    if (v !== " ") filled++;
    if (v === CW_SOL[r][c]){ ok++; if (cell) { cell.classList.add("ok"); cell.classList.remove("ng"); } }
    else if (cell){ cell.classList.remove("ok"); if (v !== " ") cell.classList.add("ng"); }
  }
  const msg = document.getElementById("cw-msg");
  if (ok === 16) msg.textContent = "全問正解！おつかれさま。";
  else if (filled === 0) msg.textContent = "まずはマスに文字を入れてみてね。";
  else msg.textContent = `16マス中 ${ok} マスが合っています。`;
});

renderCwPreview();
initGate();
</script>
